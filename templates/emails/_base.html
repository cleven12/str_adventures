<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block subject %}{{ SITE_NAME }}{% endblock %}</title>
  <style>
    body { margin:0; padding:0; background:#f1f5f2; font-family:'Segoe UI',Arial,sans-serif; color:#1a2e1f; }
    .wrapper { max-width:600px; margin:0 auto; padding:32px 16px; }
    .card { background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.08); }
    .header { background:#1a2e1f; padding:28px 32px; text-align:center; }
    .header img { width:60px; height:60px; border-radius:50%; }
    .header-title { color:#ffffff; font-size:20px; font-weight:800; margin:12px 0 4px; letter-spacing:-0.3px; }
    .header-sub { color:rgba(255,255,255,0.6); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; }
    .body { padding:32px; }
    .greeting { font-size:22px; font-weight:800; color:#1a2e1f; margin-bottom:8px; }
    .intro { font-size:15px; color:#4b5563; line-height:1.6; margin-bottom:24px; }
    .ref-box { background:#f8faf9; border:2px solid #e2e8f0; border-radius:12px; padding:16px 20px; margin-bottom:24px; }
    .ref-box .label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#94a3b8; margin-bottom:4px; }
    .ref-box .value { font-size:20px; font-weight:900; color:#1a2e1f; font-family:monospace; letter-spacing:2px; }
    .detail-table { width:100%; border-collapse:collapse; margin-bottom:24px; }
    .detail-table tr td { padding:10px 0; border-bottom:1px solid #f1f5f2; font-size:14px; }
    .detail-table tr:last-child td { border-bottom:none; }
    .detail-table .label { color:#94a3b8; font-weight:700; width:40%; }
    .detail-table .val { color:#1a2e1f; font-weight:600; }
    .cta-btn { display:block; background:#c8691a; color:#ffffff; text-decoration:none; text-align:center;
               padding:14px 28px; border-radius:50px; font-weight:800; font-size:15px; margin:24px 0; }
    .whatsapp-btn { display:block; background:#25d366; color:#ffffff; text-decoration:none; text-align:center;
                    padding:14px 28px; border-radius:50px; font-weight:800; font-size:15px; margin:12px 0; }
    .info-box { background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:16px 20px; margin-bottom:24px; }
    .info-box p { margin:0; font-size:14px; color:#92400e; line-height:1.6; }
    .success-box { background:#f0fdf4; border:1px solid #86efac; border-radius:12px; padding:16px 20px; margin-bottom:24px; }
    .success-box p { margin:0; font-size:14px; color:#166534; line-height:1.6; }
    .footer { padding:24px 32px; background:#f8faf9; border-top:1px solid #e2e8f0; text-align:center; }
    .footer p { margin:4px 0; font-size:12px; color:#94a3b8; }
    .footer a { color:#c8691a; text-decoration:none; }
    /* Staff email specific */
    .staff-header { background:#7c2d12; }
    .admin-link { display:inline-block; background:#1e40af; color:#fff; text-decoration:none;
                  padding:8px 16px; border-radius:8px; font-size:12px; font-weight:700; margin-top:8px; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <div class="header {% block header_class %}{% endblock %}">
      <img src="https://res.cloudinary.com/ducpxtvfj/image/upload/v1771429157/apple-icon_pnolj1.png"
           alt="{{ SITE_NAME }}">
      <div class="header-title">{{ SITE_NAME }}</div>
      <div class="header-sub">Kilimanjaro · Arusha · Tanzania</div>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>{{ SITE_NAME }} · Kilimanjaro Region, Tanzania</p>
      {% if WHATSAPP_NUMBER %}
      <p>WhatsApp: <a href="https://wa.me/{{ WHATSAPP_NUMBER|cut:'+' }}">{{ WHATSAPP_NUMBER }}</a></p>
      {% endif %}
      <p><a href="{{ site_url }}">{{ site_url }}</a></p>
      <p style="color:#cbd5e1;margin-top:12px;font-size:11px">
        This email was sent to you because you enquired through our website.
      </p>
    </div>
  </div>
</div>
</body>
</html>
