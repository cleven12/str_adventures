name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Django checks & tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: str_adventures_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: str_adventures_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      SECRET_KEY: ci-only-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test
