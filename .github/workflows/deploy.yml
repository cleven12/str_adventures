name: Deploy (DigitalOcean VPS)

# Manual-trigger only — there is no VPS yet. This documents the intended pipeline
# ahead of time; it will fail on the missing secrets below until the VPS exists and
# they're added under Settings -> Secrets and variables -> Actions:
#   DO_HOST        — VPS IP or hostname
#   DO_SSH_USER    — deploy user on the VPS
#   DO_SSH_KEY     — private key with access to that user
#   DO_APP_DIR     — absolute path to this app's checkout on the VPS
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DO_APP_DIR }}"
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose exec -T api python manage.py migrate --noinput
